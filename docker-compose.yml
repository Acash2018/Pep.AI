services:
  ollama:
    image: ollama/ollama:latest
    container_name: pep-ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  postgres:
    image: postgres:16-alpine
    container_name: pep-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pep_ai}
      POSTGRES_USER: ${POSTGRES_USER:-pep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pep_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pep_user} -d ${POSTGRES_DB:-pep_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pep-ai-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      CHROMA_PERSIST_DIR: /app/chromadb
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pep_user}:${POSTGRES_PASSWORD:-pep_password}@postgres:5432/${POSTGRES_DB:-pep_ai}
    volumes:
      - chroma_data:/app/chromadb
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    container_name: pep-ai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
